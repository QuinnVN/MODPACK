#Perk cards of the schools (bought with experience levels). Costs are in general.toml.
[cards]
	#Initiate (Common): power in the school (0.04 = +4%).
	# Default: 0.04
	# Range: 0.0 ~ 5.0
	initiatePower = 0.04
	#Adept (Uncommon): resistance to the school.
	# Default: 0.08
	# Range: 0.0 ~ 5.0
	adeptResistance = 0.08
	#Expert (Rare): power in the school.
	# Default: 0.06
	# Range: 0.0 ~ 5.0
	expertPower = 0.06
	#Expert (Rare): max mana.
	# Default: 20.0
	# Range: 0.0 ~ 10000.0
	expertMana = 20.0
	#Master (Epic): cooldown cut of the school's spells.
	# Default: 0.1
	# Range: 0.0 ~ 0.9
	masterCooldown = 0.1
	#Archmage (Legendary): levels added to the school's spells.
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	archmageLevels = 1.0
	#Discovered spells of the school a card needs, by tier.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	requiredInitiate = 1.0
	#
	# Default: 3.0
	# Range: 0.0 ~ 1000.0
	requiredAdept = 3.0
	#
	# Default: 6.0
	# Range: 0.0 ~ 1000.0
	requiredExpert = 6.0
	#
	# Default: 10.0
	# Range: 0.0 ~ 1000.0
	requiredMaster = 10.0
	#
	# Default: 15.0
	# Range: 0.0 ~ 1000.0
	requiredArchmage = 15.0

#School affinity (switch: schoolAffinity in general.toml).
[affinity]
	#Points for a counted cast of a spell of the school.
	# Default: 1.0
	# Range: 0.0 ~ 1000.0
	castGain = 1.0
	#Points for a kill made with a spell of the school.
	# Default: 5.0
	# Range: 0.0 ~ 10000.0
	killGain = 5.0
	#Kills of bosses give this many times the kill points.
	# Default: 3.0
	# Range: 1.0 ~ 100.0
	bossKillMultiplier = 3.0
	#Points of full affinity (the bonuses grow up to it).
	# Default: 1000.0
	# Range: 1.0 ~ 1000000.0
	maxPoints = 1000.0
	#Main school at full affinity: power in the school (0.20 = +20%).
	# Default: 0.2
	# Range: 0.0 ~ 5.0
	power = 0.2
	#Main school at full affinity: less mana for its spells.
	# Default: 0.1
	# Range: 0.0 ~ 0.9
	manaCut = 0.1
	#Main school at full affinity: shorter cooldowns for its spells.
	# Default: 0.1
	# Range: 0.0 ~ 0.9
	cooldownCut = 0.1
	#The second and third chosen schools get this part of the bonuses.
	# Default: 0.5
	# Range: 0.0 ~ 1.0
	secondaryShare = 0.5
	#At each new game day a school not used that day loses this part (only days online count).
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	decayPerDay = 0.01


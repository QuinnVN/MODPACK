# Level V rolls start above the 160 power ceiling of pre-End Apothic shelves.
# An enchantability bonus can add one level to a roll.
"minecraft:sharpness" {
    I:"Max Level"=6
    I:"Max Loot Level"=5
    I:"Forced Level Cap"=6
    S:"Min Power Function"=IF(x >= 6, 175, IF(x >= 5, 165, 1 + (x - 1) * 11))
}

"minecraft:protection" {
    I:"Max Level"=6
    I:"Max Loot Level"=4
    I:"Forced Level Cap"=6
    S:"Min Power Function"=IF(x >= 6, 175, IF(x >= 5, 165, 1 + (x - 1) * 11))
}

"minecraft:density" {
    I:"Max Level"=7
    I:"Max Loot Level"=5
    I:"Forced Level Cap"=7
    # The table rolls at most V and can boost it to VI. Enchanting power tops out at 200.
    S:"Min Power Function"=IF(x >= 6, 201, IF(x >= 5, 165, 5 + (x - 1) * 8))
    S:"Max Power Function"=IF(x >= 6, 201, 200)
}


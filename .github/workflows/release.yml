name: Build modpack release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false

      - name: Install Packwiz
        run: GOBIN="$RUNNER_TEMP" go install github.com/packwiz/packwiz@170b22d785959dda5876b54b7f16e1b807a57fb6

      - name: Build the merged pack
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pack/pack.toml", "rb"))["version"])')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'Tag %s must match pack/pack.toml version %s.\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi

          PATH="$RUNNER_TEMP:$PATH" bash ./build.sh
          shopt -s nullglob
          packs=(dist/*.mrpack)
          if (( ${#packs[@]} != 1 )); then
            printf 'Expected one merged .mrpack, found %s.\n' "${#packs[@]}" >&2
            exit 1
          fi
          mv -- "${packs[0]}" "dist/MODPACK-$GITHUB_REF_NAME.mrpack"

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=(--draft --verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "dist/MODPACK-$GITHUB_REF_NAME.mrpack" \
            --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
